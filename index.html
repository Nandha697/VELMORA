/* ===== DEALORA PURPLE + WHITE + ORANGE THEME ===== */

html {
  background: #F8F7FF;
}

  background: #F8F7FF;

}

/* Header */
header {
  background: #FFFFFF;
  color: #241757;
  border-bottom: 1px solid #E5DFFF;
  box-shadow: 0 4px 18px rgba(50, 30, 100, 0.05);
}

/* Main headings */
h1, h2, h3 {
  color: #241757;
}

h2 {
  font-weight: 800;
}

/* Hero banner */
.hero {
  background: linear-gradient(
    135deg,
    #FFFFFF 0%,
    #F0EAFF 60%,
    #FFF0DF 100%
  );

  border-radius: 28px;
  box-shadow: 0 18px 50px rgba(36, 23, 87, 0.08);
}

}

  color: #6033DB;
}

}

}

.hero-offer p {
  color: #EEE7FF;
}

/* Buttons */
.btn,
button {
  transition: all 0.2s ease;
}

.btn,
.hero .btn {
  background: #6C3BFF;
  color: #FFFFFF;
  border: none;
  font-weight: 800;
}

.btn:hover,
.hero .btn:hover {

.product,
.product-card,
.card {

}

.dept {

    };

    $('#downloadCSV').onclick = () => {

        const headers = [
            'name',
            'category',

            'retailer',
            'image',
            'description',
            'affiliate_url'
        ].join(',');

        const blob = new Blob(

        );

setTimeout(() => URL.revokeObjectURL(url), 1000);

    let bulkProducts = [];

    if (!confirm(

    )) {
        return;
    }

    const btn = $('#saveBulk');

    btn.disabled = true;

    $('#previewCSV').disabled = true;
    $('#bulkFile').disabled = true;
    $('#closeBulk').disabled = true;

    try {

        if (error) throw error;

        const count = bulkProducts.length;

        bulkProducts = [];

        await load();

        msg(`${count} products imported successfully!`);

    } catch (error) {

        msg('Import failed: ' + error.message, 1);

        btn.disabled = false;

        $('#bulkFile').disabled = false;

    }

    $('#bulkFile').onchange = () => {
        bulkProducts = [];
        $('#saveBulk').disabled = true;
        $('#bulkPreview').innerHTML = '';
    };

    $('#previewCSV').onclick = () => {

        const file = $('#bulkFile').files[0];

        bulkProducts = [];
        $('#saveBulk').disabled = true;
        $('#bulkPreview').innerHTML = '';

        if (!file) {
            return msg('Please select a CSV file.', 1);
        }

        Papa.parse(file, {

            header: true,
            skipEmptyLines: 'greedy',
            transformHeader: h => h.trim(),

            complete: function(results) {

                const errors = [];
                const seen = new Set(
                    P.map(p => p.affiliate_url).filter(Boolean)
                );

                if (results.errors.length) {
                    return msg('Invalid CSV format.', 1);
                }

                results.data.forEach((r, i) => {

                    const row = i + 2;
                    const name = (r.name || '').trim();
                    const category = (r.category || '').trim();
                    const subcategory = (r.subcategory || '').trim();
                    const retailer = (r.retailer || '').trim();
                    const link = (r.affiliate_url || '').trim();
                    const price = Number(r.price);
                    const op = (r.original_price || '').trim();
                    const original = op ? Number(op) : null;

                    if (!name || !category || !subcategory || !retailer) {
                        errors.push(`Row ${row}: Missing required details`);
                        return;
                    }

                    if (!String(r.price || '').trim() ||
                        !Number.isFinite(price) || price <= 0) {
                        errors.push(`Row ${row}: Invalid price`);
                        return;
                    }

                    if (original !== null &&
                        (!Number.isFinite(original) || original < price)) {
                        errors.push(`Row ${row}: Invalid original price`);
                        return;
                    }

                    if (!okUrl(link)) {
                        errors.push(`Row ${row}: Invalid affiliate link`);
                        return;
                    }

                    if (seen.has(link)) {
                        errors.push(`Row ${row}: Duplicate affiliate link`);
                        return;
                    }

                    if (!C.some(c =>
                        c.department === category &&
                        c.name === subcategory
                    )) {
                        errors.push(`Row ${row}: Invalid category`);
                        return;
                    }

                    const image = (r.image || '').trim();

                    if (image && !/^https:\/\//i.test(image)) {
                        errors.push(`Row ${row}: Invalid image URL`);
                        return;
                    }

                    seen.add(link);

                    bulkProducts.push({

                        id: 'product-' + crypto.randomUUID(),

                        name: name,
                        category: category,
                        subcategory: subcategory,
                        price: price,
                        original_price: original,
                        currency: 'INR',
                        retailer: retailer,
                        image: image,
                        description: (r.description || '').trim(),
                        affiliate_url: link,
                      last_verified: new Date().toLocaleDateString('en-CA', {
    timeZone: 'Asia/Kolkata'
}),
                        featured: false,
                        published: false

                    });
                });

                $('#bulkPreview').innerHTML = `

                    <p class="ok">
                        Valid Products: ${bulkProducts.length}
                    </p>

                    <p class="err">
                        Invalid Products: ${errors.length}
                    </p>

                    ${errors.map(e =>
                        `<p class="err">${esc(e)}</p>`
                    ).join('')}

                    <div class="tw">
                    <table>

                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Retailer</th>
                        </tr>

                        ${bulkProducts.map(p => `
                            <tr>
                                <td>${esc(p.name)}</td>
                                <td>${esc(p.subcategory)}</td>
                                <td>${inr(p.price)}</td>
                                <td>${esc(p.retailer)}</td>
                            </tr>
                        `).join('')}

                    </table>
                    </div>
                `;

             $('#saveBulk').disabled =
    bulkProducts.length === 0 || errors.length > 0;

msg('Preview completed. Review products before saving.');
            },

            error: function(error) {
                msg(error.message, 1);
            }

        });
    };
}

  async function loadCategoryRetailerAnalytics() {

    const categoryBox = $('#categoryAnalytics');
    const retailerBox = $('#retailerAnalytics');

    if (!categoryBox || !retailerBox) return;

    try {

        const [categories, retailers] = await Promise.all([
            sb.rpc('get_category_clicks'),
            sb.rpc('get_retailer_clicks')
        ]);

        if (categories.error) throw categories.error;
        if (retailers.error) throw retailers.error;

        function renderBars(rows, key, color) {

            if (!rows.length) {
                return '<p>No click records yet.</p>';
            }

            const max = Math.max(
                1,
                ...rows.map(r => Number(r.total_clicks))
            );

            return rows.map(r => {

                const clicks = Number(r.total_clicks);
                const width = clicks / max * 100;

                return `
                    <div style="margin:18px 0;">

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            margin-bottom:8px;
                            font-weight:600;
                        ">
                            <span>${esc(r[key])}</span>
                            <span>${clicks} clicks</span>
                        </div>

                        <div style="
                            background:#e5e7eb;
                            height:14px;
                            border-radius:10px;
                            overflow:hidden;
                        ">

                            <div style="
                                width:${width}%;
                                height:100%;
                                background:${color};
                                border-radius:10px;
                            "></div>

                        </div>

                    </div>
                `;

            }).join('');
        }

        categoryBox.innerHTML = renderBars(
            categories.data || [],
            'category',
            '#6c3bff'
        );

        retailerBox.innerHTML = renderBars(
            retailers.data || [],
            'retailer',
            '#16803c'
        );

    } catch (error) {

        categoryBox.textContent = error.message;
        retailerBox.textContent = error.message;

    }
}

  const filter = $('#verifyFilter').value;

const today = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Kolkata',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
}).format(new Date());

    productCheckboxes().forEach(cb => {

        if (!p) return;

        const searchable = [
            p.name,
            p.category,
            p.subcategory,
            p.retailer
        ].join(' ').toLowerCase();

        const searchMatch =
            searchable.includes(keyword);

        const departmentMatch =
            department === 'all' ||
            p.category === department;

        const statusMatch =
            status === 'all' ||
            (status === 'published' && p.published) ||
            (status === 'hidden' && !p.published);

        cb.checked = false;

     const date = String(p.last_verified || '').slice(0, 10);

const age = date
    ? (Date.parse(today) - Date.parse(date)) / 86400000
    : Infinity;

let verificationMatch = true;

if (filter === 'today') {
    verificationMatch = date === today;
} else if (filter === 'pending') {
    verificationMatch = date !== today;
} else if (filter === 'never') {
    verificationMatch = !date;
} else if (filter === '7days') {
    verificationMatch = !!date && age > 7;
} else if (filter === '30days') {
    verificationMatch = !!date && age > 30;
}

cb.closest('tr').hidden =
    !(searchMatch &&
      departmentMatch &&
      statusMatch &&
      verificationMatch);
    });

    updateSelectedCount();
}
